# Configuração para simulação de rede de filas em tandem
# Fila 1 (G/G/2/3) -> Fila 2 (G/G/1/5)

# Tempo inicial da simulação (primeiro cliente chega no tempo 2.0)
tempoInicial=2.0
# Fila onde o primeiro cliente chega
filaInicial=1

# Definição das filas
# Fila 1
fila.1.capacidade=3
fila.1.servidores=2
fila.1.minChegada=1.0
fila.1.maxChegada=4.0
fila.1.minAtendimento=3.0
fila.1.maxAtendimento=4.0

# Fila 2
fila.2.capacidade=5
fila.2.servidores=1
# Não tem chegadas externas - só recebe da fila 1
fila.2.minChegada=0.0
fila.2.maxChegada=0.0
fila.2.minAtendimento=2.0
fila.2.maxAtendimento=3.0

# Rotas entre as filas
# Clientes da Fila 1 sempre vão para a Fila 2
rota.1.origem=1
rota.1.destino=2
rota.1.probabilidade=1.0

# Clientes da Fila 2 saem do sistema (destino 0)
rota.2.origem=2
rota.2.destino=0
rota.2.probabilidade=1.0
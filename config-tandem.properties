# Configuração para simulação de rede de filas com 4 filas
# Topologia:
#   
#          /--> Fila 3 --\
#         /               \
# Fila 1 ---> Fila 2 ---> Fila 4 --> Saída
#         \               /
#          \------------>/ 

# Tempo inicial da simulação
tempoInicial=2.0
# Fila onde o primeiro cliente chega
filaInicial=1

# Definição das filas
# Fila 1 - Entrada do sistema (G/G/2/4)
fila.1.capacidade=4
fila.1.servidores=2
fila.1.minChegada=1.5
fila.1.maxChegada=3.5
fila.1.minAtendimento=2.0
fila.1.maxAtendimento=4.0

# Fila 2 - Fila intermediária 1 (G/G/1/3)
fila.2.capacidade=3
fila.2.servidores=1
fila.2.minChegada=0.0
fila.2.maxChegada=0.0
fila.2.minAtendimento=1.5
fila.2.maxAtendimento=2.5

# Fila 3 - Fila intermediária 2 (G/G/3/6)
fila.3.capacidade=6
fila.3.servidores=3
fila.3.minChegada=0.0
fila.3.maxChegada=0.0
fila.3.minAtendimento=3.0
fila.3.maxAtendimento=5.0

# Fila 4 - Fila final (G/G/2/5)
fila.4.capacidade=5
fila.4.servidores=2
fila.4.minChegada=0.0
fila.4.maxChegada=0.0
fila.4.minAtendimento=1.0
fila.4.maxAtendimento=3.0

# Rotas entre as filas
# Da Fila 1 para Fila 2 (40% de probabilidade)
rota.1.origem=1
rota.1.destino=2
rota.1.probabilidade=0.4

# Da Fila 1 para Fila 3 (30% de probabilidade)
rota.2.origem=1
rota.2.destino=3
rota.2.probabilidade=0.3

# Da Fila 1 para Fila 4 (30% de probabilidade)
rota.3.origem=1
rota.3.destino=4
rota.3.probabilidade=0.3

# Da Fila 2 para Fila 4 (100% de probabilidade)
rota.4.origem=2
rota.4.destino=4
rota.4.probabilidade=1.0

# Da Fila 3 para Fila 4 (100% de probabilidade)
rota.5.origem=3
rota.5.destino=4
rota.5.probabilidade=1.0

# Da Fila 4 para saída do sistema (100% de probabilidade)
rota.6.origem=4
rota.6.destino=0
rota.6.probabilidade=1.0
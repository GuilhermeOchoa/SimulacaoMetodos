# Configuração para simulação da rede de filas do exemplo
# Topologia:
#
#                  /---------> Fila 2 ---0,2--> Saída
#                 /    0,8     G/G/2/5     \
#                /              4..8min     0,5
# Entrada --> Fila 1                         \
#     2..4min   G/G/1    0,2                 \
#               1..2min   \                   \
#                          \---> Fila 3 ---0,3--> Saída
#                                G/G/2/10    0,7
#                                5..15min     |
#                                             |
#                                             v
#                                          Fila 1

# Tempo inicial da simulação
tempoInicial=2.0
# Fila onde o primeiro cliente chega
filaInicial=1

# Definição das filas
# Fila 1 - Entrada do sistema (G/G/1)
fila.1.capacidade=1000
fila.1.servidores=1
fila.1.minChegada=2.0
fila.1.maxChegada=4.0
fila.1.minAtendimento=1.0
fila.1.maxAtendimento=2.0

# Fila 2 - (G/G/2/5)
fila.2.capacidade=5
fila.2.servidores=2
fila.2.minChegada=0.0
fila.2.maxChegada=0.0
fila.2.minAtendimento=4.0
fila.2.maxAtendimento=8.0

# Fila 3 - (G/G/2/10)
fila.3.capacidade=10
fila.3.servidores=2
fila.3.minChegada=0.0
fila.3.maxChegada=0.0
fila.3.minAtendimento=5.0
fila.3.maxAtendimento=15.0

# Rotas entre as filas
# Da Fila 1 para Fila 2 (80% de probabilidade)
rota.1.origem=1
rota.1.destino=2
rota.1.probabilidade=0.8

# Da Fila 1 para Fila 3 (20% de probabilidade)
rota.2.origem=1
rota.2.destino=3
rota.2.probabilidade=0.2

# Da Fila 2 para Saída (20% de probabilidade)
rota.3.origem=2
rota.3.destino=0
rota.3.probabilidade=0.2

# Da Fila 2 para Fila 1 (30% de probabilidade)
rota.4.origem=2
rota.4.destino=1
rota.4.probabilidade=0.3

# Da Fila 2 para Fila 3 (50% de probabilidade)
rota.5.origem=2
rota.5.destino=3
rota.5.probabilidade=0.5

# Da Fila 3 para Saída (30% de probabilidade)
rota.6.origem=3
rota.6.destino=0
rota.6.probabilidade=0.3

# Da Fila 3 para Fila 1 (70% de probabilidade)
rota.7.origem=3
rota.7.destino=1
rota.7.probabilidade=0.7